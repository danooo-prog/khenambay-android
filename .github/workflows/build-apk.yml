name: Buat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Khenambay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Khenambay-apk
          path: Khenambay.apk
      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Khenambay versi ${{ github.run_number }}
          body: Unduh Khenambay.apk di bawah, lalu buka di HP Android untuk memasang.
          files: Khenambay.apk
          make_latest: true
