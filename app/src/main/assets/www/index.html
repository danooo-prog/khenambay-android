<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1408">
<meta name="description" content="Khenambay: pendataan potensi dan peluang investasi Kabupaten Jayapura berbasis AI. Tetap bisa dipakai tanpa internet.">
<title>Khenambay — Satu data, sejuta peluang investasi</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme-senja.css">
<link rel="stylesheet" href="theme-genz.css">
<link rel="stylesheet" href="layout-web.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="theme-papua.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <a class="brand" href="#/" aria-label="Khenambay, pilih peran">
    <img src="icons/logo-cenderawasih.png" alt="" width="36" height="36">
    <span><b>Khenambay</b><small id="role-label"></small></span>
  </a>
  <nav id="topnav" class="topnav" aria-label="Menu investor" hidden></nav>
  <div class="top-actions">
    <span id="conn" class="pill wait" role="status">Memeriksa…</span>
    <button type="button" id="btn-sync" class="icon-btn" title="Sinkron sekarang" aria-label="Sinkron sekarang">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14.4-4.8L20 9M20 4v5h-5M20 12a8 8 0 0 1-14.4 4.8L4 15M4 20v-5h5"/></svg>
      <span id="queue-count" class="dot-count" hidden>0</span>
    </button>
    <button type="button" id="btn-install" class="btn sm ghost" hidden>Pasang</button>
    <a id="btn-daftar" class="btn sm ghost" href="#/daftar" hidden>Daftar</a>
    <button type="button" id="btn-user" class="icon-btn" hidden></button>
  </div>
</header>

<div id="offline-banner" class="banner" hidden>
  <b>Sedang offline.</b> Semua fitur tetap jalan. Data disimpan di perangkat dan terkirim otomatis begitu ada sinyal.
</div>

<main id="app" tabindex="-1"></main>

<nav id="bottomnav" class="bottomnav" aria-label="Menu utama" hidden></nav>

<button type="button" id="cenra-fab" class="cenra-fab" aria-label="Tanya Cenra, asisten AI" hidden>
  <span class="tip">Tanya Cenra</span>
  <span class="ring"><img src="icons/cenra/cenra_menyapa.png" alt=""></span>
  <i class="online" aria-hidden="true"></i>
</button>

<div id="cenra" class="cenra-wrap" hidden>
  <div class="cenra-dim" data-close></div>
  <section class="cenra-panel" role="dialog" aria-modal="true" aria-labelledby="cenra-title">
    <div class="handle" aria-hidden="true"></div>
    <header class="cenra-head">
      <span class="avatar"><img src="icons/cenra/cenra_menyapa.png" alt=""></span>
      <div><b id="cenra-title">Cenra</b><small><i class="dot"></i> Asisten AI Khenambay · bekerja di perangkat</small></div>
      <button type="button" class="icon-btn" data-close aria-label="Tutup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="seg" role="tablist">
      <button type="button" role="tab" data-ctab="chat">Chat</button>
      <button type="button" role="tab" data-ctab="faq">FAQ</button>
    </div>
    <div id="cenra-body" class="cenra-body"></div>
    <div id="cenra-quick" class="quick"></div>
    <form id="cenra-form" class="cenra-input" autocomplete="off">
      <input id="cenra-in" placeholder="Tanya Cenra…" aria-label="Pertanyaan untuk Cenra">
      <button type="button" id="cenra-mic" class="icon-btn" aria-label="Bicara">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="send" aria-label="Kirim">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</div>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-dim" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true"><div class="handle" aria-hidden="true"></div><div id="sheet-body"></div></section>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="vendor/qrcode.js"></script>
<script src="papua.js"></script>
<script src="motion.js"></script>
<script src="stamp.js"></script>
<script src="local-api.js"></script>
<script src="app.js"></script>
</body>
</html>
