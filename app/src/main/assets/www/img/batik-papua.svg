<svg xmlns="http://www.w3.org/2000/svg" width="260" height="300" viewBox="0 0 260 300">
  <!-- Motif batik Papua, gambar sendiri (ubin berulang 260 x 300).
       Gaya: bentuk tebal berpasangan seperti kain batik Papua, yaitu sepasang burung cenderawasih yang
       saling berhadapan, ornamen silang ukiran dengan belah ketupat, dan sepasang tifa.
       Warna dibuat untuk latar gelap aplikasi: isi emas tua, aksen merah bata dan krem. -->
  <defs>
    <!-- burung cenderawasih menghadap kanan -->
    <g id="burung">
      <path d="M-8 6 C-22 12 -36 22 -36 38 C-36 52 -22 56 -15 47 C-10 40 -17 33 -23 37" fill="none" stroke="#C98A2B" stroke-width="6" stroke-linecap="round"/>
      <path d="M-4 10 C-14 20 -20 30 -18 42" fill="none" stroke="#C98A2B" stroke-width="5" stroke-linecap="round"/>
      <path d="M2 12 C-4 22 -4 32 2 40 C6 45 12 42 10 37" fill="none" stroke="#C98A2B" stroke-width="5" stroke-linecap="round"/>
      <path d="M-11 5 C-9 -8 5 -15 16 -9 C22 -5 19 6 9 10 C0 14 -9 12 -11 5 Z" fill="#C98A2B"/>
      <path d="M-5 6 C2 9 9 8 14 3" fill="none" stroke="#A23A1C" stroke-width="3" stroke-linecap="round"/>
      <path d="M-3 -4 C-10 -18 -8 -30 0 -40 L5 -29 L11 -37 L13 -24 L21 -27 L15 -10 Z" fill="#C98A2B"/>
      <path d="M2 -24 L6 -16 M8 -27 L10 -17" stroke="#F3D9A4" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="21" cy="-15" r="6.5" fill="#C98A2B"/>
      <circle cx="22.5" cy="-16" r="2" fill="#F3D9A4"/>
      <path d="M26.5 -16.5 L35 -13 L26 -10.5 Z" fill="#A23A1C"/>
    </g>
    <!-- ornamen silang (ukiran) -->
    <g id="silang">
      <path d="M-26 -36 L-16 -36 L0 -8 L16 -36 L26 -36 L8 0 L26 36 L16 36 L0 8 L-16 36 L-26 36 L-8 0 Z" fill="#C98A2B"/>
      <circle r="9" fill="#A23A1C"/><circle r="4" fill="#F3D9A4"/>
      <path d="M-21 -44 L-16 -38 L-26 -38 Z M21 -44 L26 -38 L16 -38 Z M-21 44 L-16 38 L-26 38 Z M21 44 L26 38 L16 38 Z" fill="#C98A2B"/>
      <circle cx="0" cy="-22" r="3" fill="#A23A1C"/><circle cx="0" cy="22" r="3" fill="#A23A1C"/>
    </g>
    <!-- belah ketupat bersudut tangga -->
    <g id="ketupat" fill="#C98A2B">
      <path d="M0 -14 L5 -9 L5 -4 L10 -4 L14 0 L10 4 L5 4 L5 9 L0 14 L-5 9 L-5 4 L-10 4 L-14 0 L-10 -4 L-5 -4 L-5 -9 Z"/>
      <rect x="-2.5" y="-2.5" width="5" height="5" fill="#A23A1C"/>
    </g>
    <!-- tifa miring -->
    <g id="tifa">
      <path d="M-10 -26 L10 -26 L7 -4 L12 22 L-12 22 L-7 -4 Z" fill="#C98A2B"/>
      <rect x="-11" y="-30" width="22" height="6" rx="2" fill="#A23A1C"/>
      <path d="M-8 -16 L8 -16 M-9 8 L9 8" stroke="#F3D9A4" stroke-width="1.6"/>
      <path d="M-6 -12 L0 -6 L6 -12 M-7 12 L0 18 L7 12" fill="none" stroke="#F3D9A4" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M-12 22 L-6 30 L0 22 L6 30 L12 22 Z" fill="#A23A1C"/>
    </g>
    <!-- bercak latar seperti kain -->
    <g id="bercak" fill="#C98A2B" opacity=".18">
      <path d="M0 0 C6 -5 14 -2 13 5 C12 11 3 12 -1 8 C-4 5 -3 2 0 0 Z"/>
      <path d="M22 14 C26 11 31 13 30 18 C29 22 23 22 22 19 Z"/>
    </g>
  </defs>

  <!-- bercak latar -->
  <use href="#bercak" x="96" y="40"/><use href="#bercak" x="20" y="120"/><use href="#bercak" x="200" y="104"/>
  <use href="#bercak" x="104" y="226"/><use href="#bercak" x="226" y="254"/><use href="#bercak" x="34" y="276"/>

  <!-- kolom kiri: sepasang cenderawasih berhadapan, lalu sepasang tifa -->
  <g transform="translate(72 70)">
    <use href="#burung" transform="translate(-36 0) scale(.86)"/>
    <use href="#burung" transform="translate(36 0) scale(-.86 .86)"/>
  </g>
  <g transform="translate(65 220)">
    <use href="#tifa" transform="translate(-18 0) rotate(-24)"/>
    <use href="#tifa" transform="translate(18 0) rotate(24)"/>
  </g>

  <!-- kolom kanan (setengah turun): ornamen silang diapit belah ketupat -->
  <g transform="translate(195 145)">
    <use href="#silang"/>
    <use href="#ketupat" x="-44" y="0"/><use href="#ketupat" x="44" y="0"/>
  </g>
  <!-- potongan ornamen silang di tepi atas/bawah agar ubin menyambung -->
  <g transform="translate(195 -5)"><use href="#ketupat" x="0" y="0"/></g>
  <g transform="translate(195 295)"><use href="#ketupat" x="0" y="0"/></g>
</svg>
